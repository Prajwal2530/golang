events {
    worker_connections 1024;
}

http {
    client_max_body_size 50M;
    # Timeouts for slow Spring Boot startup
    proxy_connect_timeout       300;
    proxy_send_timeout          300;
    proxy_read_timeout          300;

    # Pass real host header
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;

    server {
        listen 80;

        # Core services
        location /egov-mdms-service/     { proxy_pass http://egov-mdms-service:8080; }
        location /pb/                    { proxy_pass http://egov-mdms-service:8080/; }
        location /egov-idgen/            { proxy_pass http://egov-idgen:8080; }
        location /egov-persister/        { proxy_pass http://egov-persister:8080; }
        location ~* ^/localization/messages/v1/_search {
            error_page 405 =200 $uri;
            alias /etc/nginx/locale-all.json;
            default_type application/json;
        }
        # Also handle alternate path format (Lenovo Vantage / some clients use this)
        location ~* ^/localization/v1/messages/_search {
            error_page 405 =200 $uri;
            alias /etc/nginx/locale-all.json;
            default_type application/json;
        }
        location /localization/          { proxy_pass http://egov-localization:8080/localization/; }
        location /egov-otp/              { proxy_pass http://egov-otp:8080; }
        location /egov-filestore/        { proxy_pass http://egov-filestore:8080; }
        location /access/            { proxy_pass http://egov-accesscontrol:8080/access/; }
        location /egov-accesscontrol/{ proxy_pass http://egov-accesscontrol:8080/access/; }

        # User + auth
        location /user/                  { proxy_pass http://egov-user:8080; }
        location /egov-user/             { proxy_pass http://egov-user:8080; }

        # Workflow
        location /egov-workflow-v2/      { proxy_pass http://egov-workflow-v2:8080; }

        location /billing-service/       { 
            proxy_set_header X-Tenant-ID $arg_tenantId;
            proxy_pass http://mock-edcr:8080/billing-service/; 
        }
        location /collection-services/   { proxy_pass http://collection-services:8080; }
        location /egov-edcr/             { proxy_pass http://egov-edcr:8080; }
        location /edcr/                  { proxy_pass http://egov-edcr:8080; }

        # BPA + related
        location /bpa-services/          { proxy_pass http://bpa-service:8080; }
        location /bpa-calculator/        { proxy_pass http://bpa-calculator:8080; }
        location /land-services/         { proxy_pass http://land-services:8080; }
        location /noc-services/          { proxy_pass http://noc-services:8080; }
        location /tl-services/           { proxy_pass http://tl-services:8080; }

        # Municipal services
        location /egov-location/location/v11/boundarys/_search {
            default_type application/json;
            return 200 '{"TenantBoundary":[{"hierarchyType":{"code":"REVENUE","name":"Revenue"},"boundary":[{"code":"SUN178","name":"Ajit Nagar","label":"Locality","latitude":null,"longitude":null,"children":[],"materializedPath":"SUN178"}]}]}';
            add_header Content-Type application/json;
        }
        location /egov-location/         { proxy_pass http://egov-location:8080; }
        location /egov-searcher/         { proxy_pass http://egov-searcher:8080; }
        location /egov-user-event/       { proxy_pass http://egov-user-event:8080; }
        location /pdf-service/           { proxy_pass http://pdf-service:8080; }
        location /egov-notification-sms/ { proxy_pass http://egov-notification-sms:8080; }

        # Frontend UI — no-cache on HTML entry points so browsers always get fresh index.html
        location /employee/              { proxy_pass http://digit-ui:80/employee/; }
        location /citizen/               { proxy_pass http://digit-ui:80/citizen/; }

        location /digit-ui/ {
            proxy_pass http://digit-ui:80/digit-ui/;
            add_header Cache-Control "no-store, no-cache, must-revalidate" always;
            add_header Pragma "no-cache" always;
        }

        location /obps/ {
            proxy_pass http://digit-ui:80/digit-ui/employee/obps/;
        }

        # SPA catch-all — serve digit-ui index.html for all unmatched routes
        location / {
            proxy_pass http://digit-ui:80/digit-ui/index.html;
            add_header Cache-Control "no-store, no-cache, must-revalidate" always;
            add_header Pragma "no-cache" always;
        }
    }
}

