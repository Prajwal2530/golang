version: '3.8'

services:
  postgres:
    image: postgres:14-alpine
    container_name: egov-postgres
    environment:
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=postgres
      - POSTGRES_DB=egovdb
      - POSTGRES_HOST_AUTH_METHOD=md5
      - POSTGRES_INITDB_ARGS=--auth-host=md5
    ports:
      - "5432:5432"
    mem_limit: 500m
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d egovdb"]
      interval: 10s
      timeout: 5s
      retries: 5

  egov-mdms-service:
    build:
      context: ./DIGIT-OSS/core-services/egov-mdms-service
      dockerfile: Dockerfile
    container_name: egov-mdms-service
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      - SPRING_DATASOURCE_URL=jdbc:postgresql://postgres:5432/egovdb
      - SPRING_DATASOURCE_USERNAME=postgres
      - SPRING_DATASOURCE_PASSWORD=postgres
      - MASTERS_CONFIG_URL=file:///mdms-data/master-config.json
      - EGOV_MDMS_CONF_PATH=/mdms-data/data
      - SERVER_PORT=8094
      - JAVA_OPTS=-Xms256m -Xmx768m -XX:+UseG1GC
    volumes:
      - ./mdms-data:/mdms-data
    ports:
      - "8094:8094"
    mem_limit: 1000m
    restart: unless-stopped

  egov-location:
    build:
      context: ./DIGIT-OSS/core-services/egov-location
      dockerfile: Dockerfile
    container_name: egov-location
    depends_on:
      postgres:
        condition: service_healthy
      egov-mdms-service:
        condition: service_started
    environment:
      - SPRING_DATASOURCE_URL=jdbc:postgresql://postgres:5432/egovdb
      - SPRING_DATASOURCE_USERNAME=postgres
      - SPRING_DATASOURCE_PASSWORD=postgres
      - SPRING_DATASOURCE_DRIVER_CLASS_NAME=org.postgresql.Driver
      - SPRING_FLYWAY_ENABLED=true
      - SPRING_FLYWAY_URL=jdbc:postgresql://postgres:5432/egovdb
      - JAVA_OPTS=-Xms512m -Xmx1024m -XX:+UseG1GC
      - SERVER_PORT=8082
      - EGOV_SERVICES_EGOV_MDMS_HOSTNAME=http://egov-mdms-service:8094
    ports:
      - "8082:8082"
    mem_limit: 1500m
    restart: unless-stopped
