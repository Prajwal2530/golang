      SPRING_FLYWAY_VALIDATE_ON_MIGRATE: "false"
      FLYWAY_VALIDATE_ON_MIGRATE: "false"
      SPRING_KAFKA_BOOTSTRAP_SERVERS: "bpa-kafka:9092"
      SPRING_REDIS_HOST: "bpa-redis"
      SPRING_REDIS_PORT: "6379"
      SERVER_PORT: 8080
      JAVA_TOOL_OPTIONS: "-Xms64m -Xmx256m -XX:+UseG1GC -Degov.mdms.host=http://egov-mdms-service:8080"
      LOGGING_LEVEL_ROOT: WARN
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8080/localization/health ||
            exit 0"]
      interval: 20s
      timeout: 5s
      retries: 10
      start_period: 60s

    restart: no
    logging:
      driver: json-file
      options:
        max-size: 20m
        max-file: '3'
  egov-idgen:
    <<: *spring-db
    image: egovio/egov-idgen:v2.9.2-4a60f20
    container_name: egov-idgen
    depends_on:
