      EGOV_EDCR_HOST: "http://mock-edcr:8080"
      EGOV_LANDINFO_HOST: "http://land-services:8080"
      EGOV_LOCATION_HOST: "http://egov-location:8080"
      STATE_LEVEL_TENANT_ID: pb
      SERVER_PORT: 8080
      JAVA_TOOL_OPTIONS: "-Xms64m -Xmx256m -XX:+UseG1GC -Degov.mdms.host=http://egov-mdms-service:8080"
      LOGGING_LEVEL_ROOT: WARN
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8080/bpa-calculator/actuator/health
            || exit 0"]
      interval: 20s
      timeout: 5s
      retries: 10
      start_period: 60s

    restart: no
    logging:
      driver: json-file
      options:
        max-size: 20m
        max-file: '3'
  minio:
    image: minio/minio:latest
    container_name: minio
    ports:
      - "9000:9000"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    command: server /data
    networks:
      - bpa-network


    logging:
      driver: json-file
      options:
        max-size: 20m
        max-file: '3'
    restart: always
  mock-edcr:
    image: node:18-alpine
    container_name: mock-edcr
    working_dir: /app
    volumes:
      - ./mock-edcr.js:/app/mock-edcr.js
    command: node mock-edcr.js
    ports:
      - "8081:8080"
    networks:
      - bpa-network

    logging:
      driver: json-file
      options:
        max-size: 20m
        max-file: '3'
    restart: no

  digit-ui:
    image: egovio/digit-ui:dev-ff0db90
    container_name: digit-ui
    networks:
      - bpa-network
    ports:
      - "80:80"
    volumes:
      - ./digit-ui-index.html:/var/web/digit-ui/index.html
