version: "3.8"

networks:
  bpa-network:
    name: bpa-network
    driver: bridge

volumes:
  bpa-postgres-data:
  bpa-kafka-data:
  bpa-filestore-data:

    #  reusable anchors 
x-spring-base: &spring-base
  restart: on-failure
  networks: [bpa-network]
  deploy:
    resources:
      limits:
        cpus: "1.0"
        memory: 512M
      reservations:
        memory: 128M

x-spring-db: &spring-db
  <<: *spring-base
  depends_on:
    bpa-postgres: {condition: service_healthy}
    bpa-kafka: {condition: service_healthy}

services:
  # 
  # INFRA
  # 
  bpa-postgres:
    image: postgres:13-alpine
    container_name: bpa-postgres
    command: postgres -c max_connections=300
    restart: always
    networks: [bpa-network]
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: bpa
    ports:
      - "5432:5432"
    volumes:
      - bpa-postgres-data:/var/lib/postgresql/data
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 512M
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 3s
      retries: 20

    logging:
      driver: json-file
      options:
        max-size: 20m
        max-file: '3'
  bpa-kafka:
    image: apache/kafka:3.7.0
    container_name: bpa-kafka
    restart: always
    networks: [bpa-network]
    environment:
      CLUSTER_ID: "bpa6g3nShT-eMCtK--X86bpa"
      KAFKA_NODE_ID: "1"
      KAFKA_PROCESS_ROLES: "controller,broker"
      KAFKA_CONTROLLER_QUORUM_VOTERS: "1@bpa-kafka:9093"
      KAFKA_LISTENERS: "PLAINTEXT://:9092,CONTROLLER://:9093,EXTERNAL://:29092"
      KAFKA_ADVERTISED_LISTENERS: "PLAINTEXT://bpa-kafka:9092,EXTERNAL://localhost:29092"
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: "PLAINTEXT:PLAINTEXT,CONTROLLER:PLAINTEXT,EXTERNAL:PLAINTEXT"
      KAFKA_INTER_BROKER_LISTENER_NAME: "PLAINTEXT"
      KAFKA_CONTROLLER_LISTENER_NAMES: "CONTROLLER"
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: "1"
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: "1"
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: "1"
      KAFKA_HEAP_OPTS: "-Xms256m -Xmx512m"
    ports:
      - "29092:29092"
    volumes:
      - bpa-kafka-data:/etc/kafka/secrets
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 768M
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server
            localhost:9092 > /dev/null 2>&1"]
      interval: 15s
      timeout: 10s
      retries: 10
      start_period: 30s

    logging:
      driver: json-file
      options:
        max-size: 20m
        max-file: '3'
  bpa-redis:
    image: redis:7-alpine
    container_name: bpa-redis
    restart: always
    networks: [bpa-network]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  # 
  # CORE  TIER 1
  # 
    logging:
      driver: json-file
      options:
        max-size: 20m
        max-file: '3'
  egov-mdms-service:
    <<: *spring-db
    image: egovio/egov-mdms-service:v2.9.2-4a60f20
    container_name: egov-mdms-service
    environment:
      EGOV_MDMS_CONF_PATH: /work-dir/data
      MASTERS_CONFIG_URL: "file:///work-dir/master-config.json"
      SPRING_KAFKA_BOOTSTRAP_SERVERS: "bpa-kafka:9092"
      SERVER_PORT: "8080"
      JAVA_TOOL_OPTIONS: "-Xms64m -Xmx256m -XX:+UseG1GC -Degov.mdms.host=http://egov-mdms-service:8080"
      LOGGING_LEVEL_ROOT: WARN
    volumes:
      - ./mdms-data:/work-dir:ro
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8080/egov-mdms-service/health
            || exit 1"]
      interval: 20s
      timeout: 5s
      retries: 10
      start_period: 60s

    restart: no
    logging:
      driver: json-file
      options:
        max-size: 20m
        max-file: '3'
  egov-persister:
    <<: *spring-db
    image: egovio/egov-persister:v2.9.2-4a60f20
    container_name: egov-persister
    environment:
      SPRING_DATASOURCE_DRIVER_CLASS_NAME: "org.postgresql.Driver"
      SPRING_DATASOURCE_URL: "jdbc:postgresql://bpa-postgres:5432/bpa"
      SPRING_DATASOURCE_USERNAME: postgres
      SPRING_DATASOURCE_PASSWORD: postgres
      SPRING_FLYWAY_URL: "jdbc:postgresql://bpa-postgres:5432/bpa"
      SPRING_FLYWAY_USER: postgres
      SPRING_FLYWAY_PASSWORD: postgres
      SPRING_FLYWAY_VALIDATE_ON_MIGRATE: "false"
      FLYWAY_VALIDATE_ON_MIGRATE: "false"
      SPRING_KAFKA_BOOTSTRAP_SERVERS: "bpa-kafka:9092"
      EGOV_PERSIST_YML_REPO_PATH: "/work-dir/persister-config/"
      SERVER_PORT: 8080
      JAVA_TOOL_OPTIONS: "-Xms64m -Xmx256m -XX:+UseG1GC -Degov.mdms.host=http://egov-mdms-service:8080"
      LOGGING_LEVEL_ROOT: WARN
    volumes:
      - ./configs/egov-persister:/work-dir/persister-config:ro
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8080/common-persist/actuator/health
            || exit 1"]
      interval: 20s
      timeout: 5s
      retries: 10
      start_period: 60s

    restart: no
    logging:
      driver: json-file
      options:
        max-size: 20m
        max-file: '3'
  egov-otp:
    <<: *spring-db
    image: egovio/egov-otp:v2.9.2-4a60f20
    container_name: egov-otp
    environment:
      SPRING_DATASOURCE_DRIVER_CLASS_NAME: "org.postgresql.Driver"
      SPRING_DATASOURCE_URL: "jdbc:postgresql://bpa-postgres:5432/bpa"
      SPRING_DATASOURCE_USERNAME: postgres
      SPRING_DATASOURCE_PASSWORD: postgres
      SPRING_FLYWAY_URL: "jdbc:postgresql://bpa-postgres:5432/bpa"
      SPRING_FLYWAY_USER: postgres
      SPRING_FLYWAY_PASSWORD: postgres
      SPRING_FLYWAY_VALIDATE_ON_MIGRATE: "false"
      FLYWAY_VALIDATE_ON_MIGRATE: "false"
      SPRING_KAFKA_BOOTSTRAP_SERVERS: "bpa-kafka:9092"
      SERVER_PORT: 8080
      JAVA_TOOL_OPTIONS: "-Xms64m -Xmx128m -XX:+UseG1GC"
      LOGGING_LEVEL_ROOT: WARN
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8080/otp/health || exit 1"]
      interval: 20s
      timeout: 5s
      retries: 10
      start_period: 60s

  # 
  # CORE  TIER 2
  # 
    restart: no
    logging:
      driver: json-file
      options:
        max-size: 20m
        max-file: '3'
  egov-localization:
    <<: *spring-db
    image: egovio/egov-localization:v2.9.2-4a60f20
    container_name: egov-localization
    depends_on:
      bpa-postgres: {condition: service_healthy}
      bpa-kafka: {condition: service_healthy}
      egov-mdms-service: {condition: service_healthy}
    environment:
      SPRING_DATASOURCE_DRIVER_CLASS_NAME: "org.postgresql.Driver"
      SPRING_DATASOURCE_URL: "jdbc:postgresql://bpa-postgres:5432/bpa"
      SPRING_DATASOURCE_USERNAME: postgres
      SPRING_DATASOURCE_PASSWORD: postgres
      SPRING_FLYWAY_URL: "jdbc:postgresql://bpa-postgres:5432/bpa"
      SPRING_FLYWAY_USER: postgres
